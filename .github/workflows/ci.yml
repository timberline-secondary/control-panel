name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest
        env:
          CONTROL_PANEL_TEST_DOWNLOADS: "1"  # download ffmpeg for the shrine tests, as the app does

  windows-app:
    # Builds control-panel.exe (download it from this run's artifacts). When main gets a
    # version that hasn't been released yet, it's published as a GitHub release, so
    # releasing is just bumping __version__. (Pushing a tag like v0.2.0 still works too.)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:  # releases one at a time (main and hand-pushed tags), so they can't race
      group: >-
        ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        && 'windows-app-release' || format('windows-app-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --group build
      - name: Build control-panel.exe
        # --collect-data brings the title card font along.
        run: >-
          uv run pyinstaller --onefile --name control-panel --collect-data control_panel
          packaging/control-panel.py
      - name: Check that it starts and can draw a title card
        run: |
          ./dist/control-panel.exe --version
          ./dist/control-panel.exe --self-test
      - name: Check that it can update itself (and, for a tag, that it matches the version)
        run: uv run python packaging/check_update.py dist/control-panel.exe
      - uses: actions/upload-artifact@v4
        with:
          name: control-panel-windows
          path: dist/control-panel.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/control-panel.exe
          generate_release_notes: true
      - name: Is this a version that hasn't been released yet?
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "control-panel 0.4.0", with a Windows line ending (\r\n)
          version=$(./dist/control-panel.exe --version | tr -d '\r' | awk '{print $2}')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Couldn't read the version from the exe (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Ask GitHub first, outside any 'if', so the step fails if it can't be reached.
          released=$(git ls-remote --tags origin "refs/tags/v$version" | cut -f1)
          newest=$(git ls-remote origin refs/heads/main | cut -f1)
          tags=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##')
          if [[ -n "$released" ]]; then
            echo "v$version is already released, so there's nothing to publish."
            exit 0
          fi
          # Only the newest commit releases. An older run (e.g. re-run later) would otherwise
          # make an older version the "latest" release, hiding the newer one from the app.
          if [[ "$newest" != "$GITHUB_SHA" ]]; then
            echo "::notice::main has moved on, so the run for its newest commit releases instead."
            exit 0
          fi
          highest=$(printf '%s\n' "$tags" | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -n 1)
          if [[ -n "$highest" && "$(printf '%s\n' "$highest" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "::warning::v$version is older than v$highest, so it isn't released. Bump __version__ past $highest."
            exit 0
          fi
          # A draft left by a run that failed part way would otherwise be reused, tag and all.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"v$version\") | .id" |
            while read -r id; do
              echo "Deleting a draft of v$version left by an earlier run."
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          echo "v$version is new: publishing it."
          echo "new=true" >> "$GITHUB_OUTPUT"
      - name: Publish it as a release
        # This also creates the v<version> tag, on this commit, once the exe is uploaded.
        # (Tags made this way don't start another CI run, so it isn't built twice.) If it
        # fails, re-run the job: there's no tag yet, so it tries again.
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/control-panel.exe
          generate_release_notes: true
