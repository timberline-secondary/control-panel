name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest

  windows-app:
    # Builds control-panel.exe (download it from this run's artifacts). Pushing a
    # tag like v0.2.0 also publishes it as a GitHub release.
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --group build
      - name: Build control-panel.exe
        run: uv run pyinstaller --onefile --name control-panel packaging/control-panel.py
      - name: Check that it starts
        run: ./dist/control-panel.exe --version
      - name: Check that it can update itself
        run: uv run python packaging/check_update.py dist/control-panel.exe
      - uses: actions/upload-artifact@v4
        with:
          name: control-panel-windows
          path: dist/control-panel.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/control-panel.exe
          generate_release_notes: true
